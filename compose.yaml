name: fleetpulse-demo

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fleetpulse_demo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      POSTGRES_DB: ${DB_NAME:-fleetpulse_demo}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - demo_pgdata:/var/lib/postgresql
      - type: bind
        source: ./backend/database/schema.sql
        target: /docker-entrypoint-initdb.d/001-schema.sql
        read_only: true
        bind:
          create_host_path: false

volumes:
  demo_pgdata:
