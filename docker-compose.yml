services:
  postgres:
    image: postgres:18
    container_name: fleetpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fleetpulse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: